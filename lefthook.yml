pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm typecheck
      skip:
        - run: test "$(git diff --cached --name-only | grep -E '\.(ts|mts|cts)$|(^|/)(vitest|drizzle)\.config\.ts$' | wc -l | tr -d ' ')" = "0"

pre-push:
  commands:
    test:
      run: pnpm test
      skip:
        - run: test "$(git diff --name-only HEAD | grep -E '\.(ts|mts|cts|sql)$|(^|/)(vitest|drizzle)\.config\.ts$' | wc -l | tr -d ' ')" = "0"
